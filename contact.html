<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StonedCookieGaming</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="./styles/styles.css">
    <script type="module" src="./handling/loginregisterform.js"></script>
    <script type="module" src="./configs/keys.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@400..800&display=swap" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VKC7B3DDWD"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VKC7B3DDWD');
    </script>
    
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo-container">
            <img src="./img/logo.png" alt="Logo" class="logo"> <!-- Adjust the src attribute to your image path -->
        </div>
        <div class="text-container">
            StonedCookieGaming
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="mediacenter.html">Media Center</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="user-info" id="user-info">
            <div class="welcome-message"></div>
            <a href="./handling/popup.html" id="login-register-link" onclick="showPopup()">Login/Register</a>
        </div>
    </header>

    <main>
        <h1><u><center>Contact StonedCookieGaming</center></u></h1>
        <p><center>All inquiries regarding purchasing of services or any other questions may be sent using the form below</center></p>
        <div class="page-container">
            <div class="main-content">
                <div class="image-container">
                    <img src="./img/mailico.png" alt="Contact Image" class="left-aligned-image">
                </div>
            </div>
        </div>
        <div id="contact-container"> <!-- Changed class to id -->
            <form id="contactForm" action="#" method="post"> <!-- Change action to "#" -->
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
    
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
    
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890" required>
    
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
    
                <div class="g-recaptcha" data-sitekey="${config.recaptchaSiteKey}"></div> <!-- Add reCAPTCHA -->
    
                <br>
                
                <input type="submit" value="Submit">
            </form>
            <div id="thankYouMessage"></div>
        </div>
    </main>

    <!-- Popup for Sign-in/Register -->
    <div id="popup-container"></div>

    <script type="module">
        import config from './configs/keys.js';

        document.addEventListener("DOMContentLoaded", async function () {
            // Load the popup form dynamically
            const popupContainer = document.getElementById('popup-container');
            const response = await fetch('./handling/popup.html');
            const popupHTML = await response.text();
            popupContainer.innerHTML = popupHTML;

            // Render the reCAPTCHA in the sign-in form
            const recaptchaContainer = document.getElementById('recaptcha-container');
            if (recaptchaContainer) {
                recaptchaContainer.innerHTML = `<div class="g-recaptcha" data-sitekey="${config.recaptchaSiteKey}"></div>`;
            }
        });

        function showPopup() {
            document.getElementById("popup").style.display = "block";
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
        }

        function showForm(formId) {
            document.getElementById("signin-form").style.display = "none";
            document.getElementById("register-form").style.display = "none";
            document.getElementById(formId).style.display = "block";
        }

        function signIn() {
            // Handle sign-in logic here
        }

        function registerUser() {
            // Handle user registration logic here
        }
    </script>
</body>
</html>
